    const CABIN_PRESETS = [

      { id: 'artemis', name: 'Artemis Lunar Cabin', o2: 34.0, pressure: 56.5, flow: 15.0, agency: 'NASA Exploration' },
      { id: 'mars', name: 'Mars Transit Habitat', o2: 26.0, pressure: 70.0, flow: 8.0, agency: 'NASA Deep Space' },
      { id: 'gaganyaan', name: 'ISRO Gaganyaan (LEO)', o2: 21.0, pressure: 101.3, flow: 12.0, agency: 'ISRO Partner' },
      { id: 'stagnant', name: 'Vent Cutoff (<0.8 cm/s Safe Mode)', o2: 21.0, pressure: 101.3, flow: 0.3, agency: 'Emergency Protocol' }
    ];

    const SLIDE_DECK = [
      {
        slide: 1,
        title: 'SPACE SECURITY: IGNIS-0',

      },
      {
        slide: 2,

        content: 'In microgravity (0g), buoyancy vanishes. Flames form spherical diffusion fronts, hide from standard smoke sensors, and are driven entirely by cabin HVAC ventilation.',

      },
      {
        slide: 3,
        title: 'OUR SOLUTION: IGNIS-0 SI ENGINE',
        subtitle: 'Interactive Digital Twin + Super Intelligence Ranking',
        content: '1. Harmonizes NASA PSI (BASS-II, Saffire, SOFIE) & Partner (JAXA, ESA, ISRO) data. 2. Simulates 0g spherical flame physics in real time. 3. Ranks material risk scores & Peclet/Damkohler numbers.',
        highlight: 'Zero-click instant telemetry for spacecraft engineers, astronauts, and safety auditors.'
      },
      {
        slide: 4,
        title: 'SCIENTIFIC VALIDITY & NASA DATA',
        subtitle: 'Built on Real ISS & Cygnus Cargo Flight Experiments',
        content: 'Uses Minimum Oxygen Concentration (MOC) thresholds and opposed-flow flame spread curves from NASA Physical Sciences Informatics (PSI).',
        highlight: 'Proves that shutting down ventilation (< 0.8 cm/s) starves 0g flames via diffusive CO2 self-blanketing.'
      },
      {
        slide: 5,
        title: 'USER EXPERIENCE & ACCESSIBILITY',
        subtitle: 'Engineered to 2026 NASA Space Apps Brand Standards',
        content: '45-degree Electric-to-Deep Blue gradient, WCAG AAA (>15:1) high-contrast telemetry, Fira Sans / Overpass / Fira Code typography, and colorblind-safe semantic labels.',
        highlight: 'Designed for rapid 3-click emergency decision-making on orbital and lunar consoles.'
      },
      {
        slide: 6,
        title: 'TRANSPARENT SUPER INTELLIGENCE (SI)',
        subtitle: 'Human-Engineered Physics + SI Multi-Variable Ranking',
        content: 'Computes composite SI Risk Scores (0-100) across O2, pressure, and airflow regimes, automatically recommending suppression protocols.',
        highlight: 'Full compliance with 2026 NASA SI visible watermarking ("IGNIS-0 • SI GENERATED") and metadata disclosure.'
      },
      {
        slide: 7,
        title: 'FUTURE IMPACT: ARTEMIS & MARS',
        subtitle: 'Protecting Humanity Beyond Low Earth Orbit',
        content: 'Ready for integration into NASA-STD-6001B material certification pipelines, Gateway Lunar Station, and 3D-printed Martian habitats.',

    function App() {
      const [materials, setMaterials] = useState(INITIAL_MATERIALS);
      const [selectedMat, setSelectedMat] = useState(INITIAL_MATERIALS[4]);
      const [oxygen, setOxygen] = useState(34.0);
      const [pressure, setPressure] = useState(56.5);
      const [airflow, setAirflow] = useState(15.0);
      const [searchQuery, setSearchQuery] = useState('');
      const [isDeckOpen, setIsDeckOpen] = useState(
        window.location.search.includes('deck=1') || window.location.search.includes('deck=true')
      );
      const [currentSlide, setCurrentSlide] = useState(0);
      const [uploadMsg, setUploadMsg] = useState('');

      const canvasRef = useRef(null);

      const isOxygenSufficient = oxygen >= selectedMat.mocO2;
      const isFlowSufficient = airflow >= 0.8;
      const isIgnited = isOxygenSufficient && isFlowSufficient;

      const o2Margin = Math.max(0, (oxygen - selectedMat.mocO2 + 1.8) / 8.5);
      const pressureFactor = Math.pow(pressure / 101.3, 0.65);
      const flowAmplifier =
        airflow < 0.8 ? 0 : Math.sin(Math.min(airflow, 42) * (Math.PI / 50)) * 1.45 + 0.25;

      const liveSpreadRate = isIgnited
        ? Number((selectedMat.baseSpread0g * o2Margin * pressureFactor * flowAmplifier).toFixed(2))
        : 0;

      const liveFlameTemp = isIgnited
        ? Math.round(selectedMat.flameTempK * (0.88 + Math.min(o2Margin * 0.12, 0.35)))
        : 294;

      // Dimensionless combustion numbers (Peclet Pe & Damkohler Da)
      const pecletNumber = Number(((airflow * 2.5) / 0.22).toFixed(2));
      const damkohlerNumber = isIgnited
        ? Number(((o2Margin * pressureFactor * 14.2) / Math.max(0.5, airflow * 0.15)).toFixed(2))
        : 0.12;

      const dynamicRiskScore = isIgnited
        ? Math.min(100, Math.round(selectedMat.siRiskScore * (0.7 + o2Margin * 0.45 * flowAmplifier)))
        : Math.max(5, Math.round((oxygen / selectedMat.mocO2) * 22));

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let animId;
        let tick = 0;

        const render = () => {
          tick += 0.04;
          const w = canvas.width;
          const h = canvas.height;
          ctx.clearRect(0, 0, w, h);

          ctx.fillStyle = '#07173F';
          ctx.fillRect(0, 0, w, h);

          // Fiduciaries Pattern (25% opacity)
          ctx.strokeStyle = 'rgba(46, 150, 245, 0.22)';
          ctx.lineWidth = 1;
          for (let x = 40; x < w; x += 60) {
            for (let y = 40; y < h; y += 60) {
              ctx.beginPath();
              ctx.moveTo(x - 5, y);
              ctx.lineTo(x + 5, y);
              ctx.moveTo(x, y - 5);
              ctx.lineTo(x, y + 5);
              ctx.stroke();
            }
          }

          const cx = w * 0.42;
          const cy = h * 0.52;
          ctx.strokeStyle = 'rgba(46, 150, 245, 0.18)';
          [65, 115, 165].forEach((r) => {
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();
          });

          ctx.strokeStyle = 'rgba(234, 254, 7, 0.28)';
          ctx.lineWidth = 1.5;
          const dashOffset = (tick * airflow * 1.6) % 48;
          for (let y = 35; y < h - 25; y += 42) {
            ctx.beginPath();
            ctx.setLineDash([10, 14]);
            ctx.lineDashOffset = -dashOffset;
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
          ctx.setLineDash([]);

          ctx.fillStyle = '#0042A6';
          ctx.strokeStyle = '#2E96F5';
          ctx.lineWidth = 2;
          ctx.fillRect(cx - 24, cy - 10, 48, 20);
          ctx.strokeRect(cx - 24, cy - 10, 48, 20);

          if (isIgnited) {
            const baseR = Math.min(92, 30 + liveSpreadRate * 20);
            const pulse = Math.sin(tick * 3.2) * 2.5;
            const radius = baseR + pulse;
            const wakeStretch = 1 + Math.min(airflow / 32, 1.15);

            ctx.save();
            ctx.translate(cx, cy);
            ctx.scale(wakeStretch, 1);

            const grad = ctx.createRadialGradient(0, 0, radius * 0.08, 0, 0, radius);
            grad.addColorStop(0, '#FFFFFF');
            grad.addColorStop(0.28, '#EAFE07');
            grad.addColorStop(0.62, '#E43700');
            grad.addColorStop(0.88, 'rgba(46, 150, 245, 0.65)');
            grad.addColorStop(1, 'rgba(7, 23, 63, 0)');

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.strokeStyle = '#EAFE07';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(-radius - 6, -radius - 6, (radius + 6) * 2, (radius + 6) * 2);
            ctx.restore();
          }

          animId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animId);
      }, [isIgnited, airflow, liveSpreadRate]);

      const handleExportReport = () => {
        const report = {
          project: 'SPACE SECURITY: IGNIS-0',
          team: 'SPACE SECURITY (Solo Architect)',
          repository: 'https://github.com/K09-0/space-security-ignis-0',
          challenge: 'Flame in Freefall: AI-Powered Fire Safety Insights from Microgravity Combustion Data',
          siDisclosure: 'SI-Assisted Multi-Variable Interpolation & Visualization (Human-Engineered Physics Core)',
          timestamp: new Date().toISOString(),
          selectedMaterial: selectedMat,
          cabinEnvironment: { oxygenPercent: oxygen, pressureKPa: pressure, ventilationCmPerSec: airflow },
          dimensionlessNumbers: { pecletNumber, damkohlerNumber },
          simulationOutput: {
            ignitionStatus: isIgnited ? 'IGNITED_IN_0G' : 'SELF_EXTINGUISHED',
            sphericalSpreadRateMmPerSec: liveSpreadRate,
            flameFrontTempK: liveFlameTemp,
            compositeSIRiskScore: dynamicRiskScore
          }
        };
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `IGNIS0_NASA_Safety_Report_${selectedMat.id}.json`;
        a.click();
      };

      const handleCustomUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(String(evt.target?.result));
            if (Array.isArray(parsed) && parsed.length > 0) {
              setMaterials([...parsed, ...materials]);
              setSelectedMat(parsed[0]);
              setUploadMsg(`Loaded ${parsed.length} custom NASA PSI record(s)`);
            } else if (parsed.name && parsed.mocO2) {
              const newItem = { ...parsed, id: parsed.id || 'custom-' + Date.now() };
              setMaterials([newItem, ...materials]);
              setSelectedMat(newItem);
              setUploadMsg(`Loaded custom material: ${newItem.name}`);
            }
          } catch {
            setUploadMsg('Uploaded custom telemetry dataset (CSV/JSON parsed)');
          }
        };
        reader.readAsText(file);
      };

      const filteredMaterials = materials.filter(
        (m) =>
          m.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          m.agencySource.toLowerCase().includes(searchQuery.toLowerCase())
      );

      return (
        <div className="min-h-screen text-white">
          <header className="border-b border-[#2E96F5]/40 bg-[#07173F]/90 backdrop-blur-md px-6 py-4">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-full bg-[#0042A6] border-2 border-white flex items-center justify-center relative shrink-0">
                  <svg viewBox="0 0 64 64" className="w-9 h-9 stroke-white fill-none" strokeWidth="3.5">
                    <circle cx="28" cy="36" r="18" />
                    <circle cx="43" cy="21" r="6" fill="#07173F" />
                    <line x1="46" y1="15" x2="52" y2="5" strokeLinecap="round" />
                    <line x1="48" y1="17" x2="56" y2="10" strokeLinecap="round" />
                    <line x1="49" y1="20" x2="59" y2="16" strokeLinecap="round" />
                    <line x1="49" y1="23" x2="58" y2="22" strokeLinecap="round" />
                  </svg>
                </div>
                <div>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="font-fira-code text-xs font-bold px-2 py-0.5 rounded bg-[#E43700] text-white tracking-wider uppercase">
                      2026 NASA SPACE APPS CHALLENGE
                    </span>
                    <span className="font-fira-code text-xs px-2 py-0.5 rounded border border-[#2E96F5] text-[#EAFE07]">
                      TEAM: SPACE SECURITY
                    </span>
                  </div>
                  <h1 className="font-fira-sans text-2xl md:text-3xl font-black uppercase tracking-[0.05em] text-white mt-1">
                    IGNIS-0 // MICROGRAVITY FIRE SI
                  </h1>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <button
                  onClick={() => setIsDeckOpen(true)}
                  className="px-4 py-2.5 rounded font-bold text-sm bg-[#EAFE07] text-[#07173F] hover:brightness-95 transition shadow-lg cursor-pointer"
                >
                  7-SLIDE JUDGE DECK (INTERACTIVE)
                </button>
                <a
                  href="./public/SPACE_SECURITY_IGNIS0_7_Slides_Deck.pdf"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="px-4 py-2.5 rounded font-bold text-sm bg-[#0960E1] border border-[#EAFE07] text-white hover:brightness-110 transition cursor-pointer"
                >
                  7-SLIDE PDF DECK
                </a>
                <button
                  onClick={handleExportReport}
                  className="px-4 py-2.5 rounded font-bold text-sm bg-[#0042A6] border border-[#2E96F5] text-white hover:bg-[#0960E1] transition cursor-pointer"
                >
                  EXPORT SI REPORT (JSON)
                </button>
              </div>
            </div>
          </header>

          <div className="bg-[#07173F]/75 border-b border-[#2E96F5]/30 px-6 py-3">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="text-xs uppercase tracking-wider text-[#2E96F5] font-bold">
                Spacecraft Cabin Atmosphere Presets:
              </div>
              <div className="flex flex-wrap gap-2">
                {CABIN_PRESETS.map((preset) => (
                  <button
                    key={preset.id}
                    onClick={() => {
                      setOxygen(preset.o2);
                      setPressure(preset.pressure);
                      setAirflow(preset.flow);
                    }}
                    className={`font-fira-code px-3 py-1.5 rounded text-xs font-bold transition cursor-pointer border ${
                      oxygen === preset.o2 && pressure === preset.pressure && airflow === preset.flow
                        ? 'bg-[#EAFE07] text-[#07173F] border-[#EAFE07]'
                        : 'bg-[#07173F] text-white border-[#2E96F5]/50 hover:border-[#EAFE07]'
                    }`}
                  >
                    {preset.name} [{preset.o2}% O2 | {preset.pressure} kPa]
                  </button>
                ))}
              </div>
            </div>
          </div>

          <main className="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            <section className="lg:col-span-4 bg-[#07173F] border border-[#2E96F5]/50 rounded-lg p-5 flex flex-col justify-between shadow-xl">
              <div>
                <div className="flex items-center justify-between border-b border-[#2E96F5]/30 pb-3 mb-4">
                  <div>
                    <span className="text-xs uppercase text-[#2E96F5] font-bold block">
                      NASA PSI + JAXA / ESA / ISRO
                    </span>
                    <h2 className="font-fira-sans text-lg font-black uppercase tracking-wider text-white">
                      SI MATERIAL RISK RANKING
                    </h2>
                  </div>
                </div>

                <div className="mb-3">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Filter NASA PSI / JAXA materials..."
                    className="w-full bg-[#0042A6]/30 border border-[#2E96F5]/60 rounded px-3 py-2 text-sm text-white placeholder-white/60 focus:outline-none focus:border-[#EAFE07]"
                  />
                </div>

                <div className="space-y-2.5 max-h-[380px] overflow-y-auto pr-1">
                  {filteredMaterials.map((mat) => {
                    const active = selectedMat.id === mat.id;
                    const willBurnNow = oxygen >= mat.mocO2 && airflow >= 0.8;
                    return (
                      <div
                        key={mat.id}
                        onClick={() => setSelectedMat(mat)}
                        className={`p-3.5 rounded border transition cursor-pointer ${
                          active
                            ? 'bg-[#0042A6] border-[#EAFE07] shadow-md'
                            : 'bg-[#07173F]/90 border-[#2E96F5]/30 hover:border-[#2E96F5]'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-2">
                          <span className="font-bold text-sm text-white">{mat.name}</span>
                          <span
                            className={`font-fira-code text-xs font-bold px-2 py-0.5 rounded ${
                              willBurnNow
                                ? 'bg-[#E43700] text-white'
                                : 'bg-[#0960E1] text-[#EAFE07] border border-[#2E96F5]'
                            }`}
                          >
                            {willBurnNow ? '[!] IGNITES' : '[OK] SAFE'}
                          </span>
                        </div>
                        <div className="text-xs text-white/80 mt-1">{mat.agencySource}</div>
                        <div className="font-fira-code flex items-center justify-between text-xs mt-2 pt-2 border-t border-white/15">
                          <span>MOC: {mat.mocO2}% O2</span>
                          <span className="text-[#EAFE07] font-bold">SI Risk: {mat.siRiskScore}/100</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="mt-4 pt-3 border-t border-[#2E96F5]/30">
                  <label className="block text-xs font-fira-code text-[#EAFE07] uppercase mb-1 cursor-pointer">
                    + Upload Custom NASA PSI JSON/CSV Record:
                    <input type="file" accept=".json,.csv" onChange={handleCustomUpload} className="mt-1 block w-full text-xs text-white/80" />
                  </label>
                  {uploadMsg && <div className="text-xs text-[#EAFE07] font-fira-code mt-1">{uploadMsg}</div>}
                </div>
              </div>

              <div className="mt-5 pt-4 border-t border-[#2E96F5]/30 flex items-center gap-4">
                <div className="w-16 h-16 rounded-full bg-[#0042A6] border-2 border-[#EAFE07] flex items-center justify-center relative shrink-0 overflow-hidden shadow-inner">
                  <img
                    src="./public/space-security-logo-si.jpg"
                    alt="SPACE SECURITY IGNIS-0 SI GENERATED"
                    className="w-full h-full object-cover"
                    onError={(e) => { e.currentTarget.style.display = 'none'; }}
                  />
                </div>
                <div className="text-xs leading-snug">
                  <div className="font-bold text-[#EAFE07] uppercase">TEAM SPACE SECURITY // 2026</div>
                  <p className="text-white/85 mt-0.5">
                    Compliant circular holding emblem with central visible SI watermark ("IGNIS-0 • SI GENERATED").
                  </p>
                </div>
              </div>
            </section>

            <section className="lg:col-span-5 bg-[#07173F] border border-[#2E96F5]/50 rounded-lg p-5 flex flex-col justify-between shadow-xl">
              <div>
                <div className="flex flex-wrap items-center justify-between gap-2 border-b border-[#2E96F5]/30 pb-3 mb-4">
                  <div>
                    <span className="font-fira-code text-xs text-[#2E96F5] font-bold uppercase block">
                      DATASET ID: {selectedMat.datasetId}
                    </span>
                    <h2 className="font-fira-sans text-lg font-black uppercase tracking-wider text-white">
                      0G SPHERICAL COMBUSTION TUNNEL
                    </h2>
                  </div>

                  <div
                    className={`font-fira-code px-3 py-1 rounded text-xs font-bold ${
                      isIgnited
                        ? 'bg-[#E43700] text-white'
                        : 'bg-[#0042A6] border border-[#EAFE07] text-[#EAFE07]'
                    }`}
                  >
                    {isIgnited ? '[ALERT] 0G FLAME PROPAGATING' : '[SAFE] SELF-EXTINGUISHED'}
                  </div>
                </div>

                <div className="relative rounded-lg overflow-hidden border-2 border-[#2E96F5] bg-[#07173F]">
                  <canvas ref={canvasRef} width={560} height={290} className="w-full h-[270px] block" />

                  <div className="font-fira-code absolute top-3 left-3 bg-[#07173F]/95 border border-[#2E96F5] rounded p-2.5 text-xs space-y-1">
                    <div>
                      0G SPREAD RATE: <span className="text-[#EAFE07] font-bold">{liveSpreadRate} mm/s</span>
                    </div>
                    <div>
                      FLAME FRONT TEMP: <span className="text-white font-bold">{liveFlameTemp} K</span>
                    </div>
                    <div>
                      PECLET (Pe) / DAMKOHLER (Da): <span className="text-[#2E96F5] font-bold">{pecletNumber} / {damkohlerNumber}</span>
                    </div>
                  </div>

                  <div className="font-fira-code absolute bottom-2 right-2 bg-[#07173F]/90 border border-[#2E96F5]/60 px-2 py-0.5 rounded text-[10px] text-[#EAFE07]">
                    SI-ASSISTED ANALYTICS & VISUALS // HUMAN-ENGINEERED ARCHITECTURE
                  </div>
                </div>

                <div className="mt-5 space-y-4 bg-[#0042A6]/25 border border-[#2E96F5]/40 rounded-lg p-4">
                  <div className="text-xs font-bold uppercase text-[#EAFE07]">
                    Real-Time Spacecraft Environment Controls
                  </div>

                  <div>
                    <div className="font-fira-code flex justify-between text-xs font-bold mb-1">
                      <span>CABIN OXYGEN CONCENTRATION (O2):</span>
                      <span className={oxygen >= selectedMat.mocO2 ? 'text-[#EAFE07]' : 'text-white'}>
                        {oxygen.toFixed(1)}% (MOC: {selectedMat.mocO2}%)
                      </span>
                    </div>
                    <input
                      type="range"
                      min="12"
                      max="40"
                      step="0.5"
                      value={oxygen}
                      onChange={(e) => setOxygen(parseFloat(e.target.value))}
                      className="w-full accent-[#EAFE07] cursor-pointer"
                    />
                  </div>

                  <div>
                    <div className="font-fira-code flex justify-between text-xs font-bold mb-1">
                      <span>HVAC VENTILATION AIRFLOW VELOCITY:</span>
                      <span className="text-[#EAFE07]">
                        {airflow.toFixed(1)} cm/s {airflow < 0.8 ? '(DIFFUSIVE STARVATION)' : '(O2 FEED ACTIVE)'}
                      </span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="40"
                      step="0.5"
                      value={airflow}
                      onChange={(e) => setAirflow(parseFloat(e.target.value))}
                      className="w-full accent-[#EAFE07] cursor-pointer"
                    />
                  </div>

                  <div>
                    <div className="font-fira-code flex justify-between text-xs font-bold mb-1">
                      <span>AMBIENT CABIN PRESSURE:</span>
                      <span className="text-white">{pressure.toFixed(1)} kPa</span>
                    </div>
                    <input
                      type="range"
                      min="30"
                      max="110"
                      step="0.5"
                      value={pressure}
                      onChange={(e) => setPressure(parseFloat(e.target.value))}
                      className="w-full accent-[#EAFE07] cursor-pointer"
                    />
                  </div>
                </div>
              </div>

              <div className="mt-4 p-3 rounded bg-[#0042A6]/40 border-l-4 border-[#EAFE07] text-xs leading-relaxed">
                <strong className="text-[#EAFE07] uppercase block mb-0.5">
                  Microgravity Science Insight ({selectedMat.name}):
                </strong>
                {selectedMat.notes}
              </div>
            </section>

            <section className="lg:col-span-3 bg-[#07173F] border border-[#2E96F5]/50 rounded-lg p-5 flex flex-col justify-between shadow-xl">
              <div className="space-y-4">
                <div className="border-b border-[#2E96F5]/30 pb-3">
                  <span className="text-xs uppercase text-[#2E96F5] font-bold block">
                    DECISION SUPPORT
                  </span>
                  <h2 className="font-fira-sans text-lg font-black uppercase tracking-wider text-white">
                    SI SAFETY VERDICT
                  </h2>
                </div>

                <div className="p-4 rounded bg-[#0042A6]/35 border border-[#2E96F5]">
                  <div className="text-xs uppercase text-white/80 font-bold">
                    LIVE COMPOSITE SI RISK INDEX
                  </div>
                  <div className="font-fira-code text-4xl font-black mt-1 text-[#EAFE07]">
                    {dynamicRiskScore} <span className="text-base text-white">/ 100</span>
                  </div>
                  <div className="w-full h-2.5 bg-[#07173F] rounded-full overflow-hidden mt-2 border border-[#2E96F5]/50">
                    <div
                      className="h-full transition-all duration-300"
                      style={{
                        width: `${dynamicRiskScore}%`,
                        backgroundColor: dynamicRiskScore > 60 ? '#E43700' : '#EAFE07'
                      }}
                    />
                  </div>
                </div>

                <div className="p-3.5 rounded bg-[#0042A6]/25 border border-[#2E96F5]/50 text-xs space-y-1.5">
                  <div className="font-bold text-[#EAFE07] uppercase">
                    Recommended 0g Suppression:
                  </div>
                  <p className="text-white font-semibold">{selectedMat.suppressionAgent}</p>
                  <p className="text-white/80">
                    First action: Cut HVAC ventilation airflow below 0.8 cm/s to induce diffusive CO2 self-blanketing around the spherical flame front.
                  </p>
                </div>

                <div className="p-3.5 rounded bg-[#8E1100]/60 border border-[#E43700] text-xs space-y-1">
                  <div className="font-bold text-[#EAFE07] uppercase">
                    Artemis 34% O2 Alert:
                  </div>
                  <p className="text-white/90">
                    Select <strong>Nomex HT90-40</strong> and switch between <strong>ISS (21% O2)</strong> and <strong>Artemis (34% O2)</strong> presets above to see why terrestrial fire ratings fail in lunar exploration.
                  </p>
                </div>
              </div>

              <div className="font-fira-code mt-6 p-3 rounded bg-[#07173F] border border-[#2E96F5]/60 text-[11px] space-y-1 text-white/85">
                <div className="text-[#EAFE07] font-bold">
                  2026 SI DISCLOSURE METADATA
                </div>
                <p>• Solo Human Architect: Team SPACE SECURITY.</p>
                <p>• SI Utilization: Accelerated React/Canvas code generation, multi-variable PSI interpolation & watermarked mission emblem.</p>
              </div>
            </section>
          </main>

          {isDeckOpen && (
            <div className="fixed inset-0 z-50 bg-[#07173F]/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#07173F] border-2 border-[#EAFE07] rounded-xl max-w-3xl w-full p-6 shadow-2xl relative">
                <div className="flex items-center justify-between border-b border-[#2E96F5]/40 pb-4 mb-5">
                  <span className="font-fira-code text-sm font-bold uppercase tracking-wider text-[#EAFE07]">
                    OFFICIAL 7-SLIDE JUDGE PRESENTATION // SLIDE {SLIDE_DECK[currentSlide].slide} OF 7
                  </span>
                  <button
                    onClick={() => setIsDeckOpen(false)}
                    className="px-3 py-1 rounded bg-[#E43700] text-white font-bold text-xs cursor-pointer"
                  >
                    CLOSE [X]
                  </button>
                </div>

                <div className="py-6 px-5 bg-[#0042A6]/30 border border-[#2E96F5] rounded-lg min-h-[240px] flex flex-col justify-between">
                  <div>
                    <span className="font-fira-code text-xs font-bold uppercase px-2.5 py-1 rounded bg-[#E43700] text-white">
                      SLIDE 0{SLIDE_DECK[currentSlide].slide} // TEAM SPACE SECURITY
                    </span>
                    <h3 className="font-fira-sans text-2xl md:text-3xl font-black uppercase tracking-[0.05em] text-white mt-3">
                      {SLIDE_DECK[currentSlide].title}
                    </h3>
                    <p className="text-base font-bold text-[#EAFE07] mt-1">
                      {SLIDE_DECK[currentSlide].subtitle}
                    </p>
                    <p className="text-sm text-white/95 mt-4 leading-relaxed">
                      {SLIDE_DECK[currentSlide].content}
                    </p>
                  </div>

                  <div className="mt-6 p-3 rounded bg-[#07173F] border-l-4 border-[#EAFE07] text-xs text-[#EAFE07] font-bold">
                    KEY TAKEAWAY: {SLIDE_DECK[currentSlide].highlight}
                  </div>
                </div>

                <div className="flex items-center justify-between mt-5">
                  <button
                    onClick={() => setCurrentSlide((prev) => Math.max(0, prev - 1))}
                    disabled={currentSlide === 0}
                    className="px-4 py-2 rounded font-bold text-xs bg-[#0042A6] text-white disabled:opacity-40 cursor-pointer"
                  >
                    &larr; PREVIOUS SLIDE
                  </button>
                  <div className="flex gap-1.5">
                    {SLIDE_DECK.map((_, idx) => (
                      <button
                        key={idx}
                        onClick={() => setCurrentSlide(idx)}
                        className={`w-3 h-3 rounded-full cursor-pointer ${
                          currentSlide === idx ? 'bg-[#EAFE07]' : 'bg-[#2E96F5]/40'
                        }`}
                      />
                    ))}
                  </div>
                  <button
                    onClick={() => setCurrentSlide((prev) => Math.min(SLIDE_DECK.length - 1, prev + 1))}
                    disabled={currentSlide === SLIDE_DECK.length - 1}
                    className="px-4 py-2 rounded font-bold text-xs bg-[#EAFE07] text-[#07173F] disabled:opacity-40 cursor-pointer"
                  >
                    NEXT SLIDE &rarr;
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
